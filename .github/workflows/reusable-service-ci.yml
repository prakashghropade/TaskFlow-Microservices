name: Reusable Service CI

on:
  workflow_call:

    inputs:
      service:
        description: "Microservice workspace name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: true

      DOCKERHUB_PASSWORD:
        required: true


env:
  IMAGE_NAME: prakashghorpade2001/${{ inputs.service }}:${{ inputs.image_tag }}


jobs:

  ci:

    name: CI - ${{ inputs.service }}

    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:

      # ---------------------------------------
      # Checkout
      # ---------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      #----------------------------------------
      # Run SonarQube analysis
      #----------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      
      #-----------------------------------------
      # Fail pipeline if Quality Gate fails
      #-----------------------------------------
      
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ---------------------------------------
      # Setup Docker Buildx
      # ---------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------
      # Login to Docker Hub
      # ---------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # ---------------------------------------
      # Build Docker Image
      # ---------------------------------------
      - name: Build ${{ inputs.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          build-args: |
            SERVICE=${{ inputs.service }}

          tags: |
            ${{ env.IMAGE_NAME }}

          load: true

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------
      # Push Docker Image
      # ---------------------------------------
      - name: Push ${{ inputs.service }} image
        run: |
          docker push ${{ env.IMAGE_NAME }}


      # ---------------------------------------
      # Cleanup Runner
      # ---------------------------------------
      - name: Cleanup runner
        if: always()
        run: |

          echo "Cleaning workspace..."

          sudo rm -rf "$GITHUB_WORKSPACE"/* || true


          echo "Removing Docker resources..."

          docker system prune -af --volumes || true


          echo "Removing npm cache..."

          npm cache clean --force || true


          echo "Cleaning temporary files..."

          sudo rm -rf /tmp/* || true


          echo "Disk usage after cleanup..."

          df -h
