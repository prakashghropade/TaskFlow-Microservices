name: Reusable Service CI

on:
  workflow_call:

    inputs:
      service:
        description: "Microservice workspace name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: true

      DOCKERHUB_PASSWORD:
        required: true


env:
  IMAGE_NAME: prakashghorpade2001/${{ inputs.service }}:${{ inputs.image_tag }}


jobs:

  ci:

    name: CI - ${{ inputs.service }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ---------------------------------------
      # Checkout
      # ---------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------
      # Setup Docker Buildx
      # ---------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------
      # Login to Docker Hub
      # ---------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # ---------------------------------------
      # Build Docker Image
      # ---------------------------------------
      - name: Build ${{ inputs.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          build-args: |
            SERVICE=${{ inputs.service }}

          tags: |
            ${{ env.IMAGE_NAME }}

          load: true

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------
      # Push Docker Image
      # ---------------------------------------
      - name: Push ${{ inputs.service }} image
        run: |
          docker push ${{ env.IMAGE_NAME }}


      # ---------------------------------------
      # Cleanup Runner
      # ---------------------------------------
      - name: Cleanup runner
        if: always()
        run: |

          echo "Cleaning workspace..."

          sudo rm -rf "$GITHUB_WORKSPACE"/* || true


          echo "Removing Docker resources..."

          docker system prune -af --volumes || true


          echo "Removing npm cache..."

          npm cache clean --force || true


          echo "Cleaning temporary files..."

          sudo rm -rf /tmp/* || true


          echo "Disk usage after cleanup..."

          df -h
