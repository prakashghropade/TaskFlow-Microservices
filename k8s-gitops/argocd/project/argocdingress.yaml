apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
sepc:
  ingressClassName: nginx

  rules:
    - host: argocd.prakashghorpade.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: argocd-server
              port:
                number: 80
      