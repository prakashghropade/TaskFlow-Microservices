apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-stag-app-of-apps
  namespace: argocd

spec:
  project: microservicesproject
  source:
    repoURL: 'https://github.com/prakashghropade/TaskFlow-Microservices.git'
    targetRevision: main
    path: k8s-gitops/argocd/apps/stag-environment
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m